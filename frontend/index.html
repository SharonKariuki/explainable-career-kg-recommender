<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7fb" />
    <link rel="icon" type="image/png" href="/brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&family=Poppins:wght@700&display=swap" />
    <title>AjiraGuide</title>
    <script>
      // Apply the saved theme, or the system one, before first paint so dark mode does not flash light.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('ajiraguide.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
